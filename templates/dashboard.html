<!DOCTYPE html>
<html>
<head>

<title>PawStore</title>

<link rel="stylesheet"
href="/static/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="fw-bold text-success">PawStore</h1>
            <small class="text-muted">
                Manajemen Gudang Petshop
            </small>
        </div>

        <div>

            <button
                class="btn btn-dark me-2"
                onclick="showToken()">

                <i class="fa-solid fa-key"></i>
                Tampilkan Token

            </button>

            <button
                class="btn btn-success"
                onclick="openAddModal()">

                <i class="fa-solid fa-plus"></i>
                Tambah Produk

            </button>

        </div>

    </div>

    <div class="row mb-4">

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Produk</h6>
                    <h2 id="totalProduk">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Stok</h6>
                    <h2 id="totalStok">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Stok Menipis</h6>
                    <h2 id="stokMenipis">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Kategori</h6>
                    <h2 id="jumlahKategori">0</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h4 class="mb-3">
                Tambah Produk Baru
            </h4>

            <div class="row">

                <div class="col-md-4 mb-2">
                    <input
                    class="form-control"
                    id="nama"
                    placeholder="Nama Produk">
                </div>

                <div class="col-md-2 mb-2">
                    <input
                    class="form-control"
                    id="kategori"
                    placeholder="Kategori">
                </div>

                <div class="col-md-2 mb-2">
                    <input
                    class="form-control"
                    id="harga"
                    placeholder="Harga">
                </div>

                <div class="col-md-2 mb-2">
                    <input
                    class="form-control"
                    id="stok"
                    placeholder="Stok">
                </div>

                <div class="col-md-2 mb-2">
                    <input
                    class="form-control"
                    id="supplier"
                    placeholder="Supplier">
                </div>

            </div>

            <button
            class="btn btn-success mt-3"
            onclick="addProduct()">

                Simpan Produk

            </button>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-striped">

                <thead>

                    <tr>
                        <th>Produk</th>
                        <th>Kategori</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Supplier</th>
                        <th width="180">Aksi</th>
                    </tr>

                </thead>

                <tbody id="data"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='scripts.js') }}"></script>

</body>
</html>
